name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - name: Resguardar archivos personalizados
        run: |
          mkdir -p /tmp/backup
          if [ -f "lib/main.dart" ]; then cp lib/main.dart /tmp/backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/backup/; fi
      - run: flutter create . --org com.albanil.app --project-name app_obra_pro --platforms=android --overwrite
      - name: Restaurar archivos personalizados
        run: |
          mkdir -p lib
          if [ -f "/tmp/backup/main.dart" ]; then cp /tmp/backup/main.dart lib/main.dart; fi
          if [ -f "/tmp/backup/pubspec.yaml" ]; then cp /tmp/backup/pubspec.yaml pubspec.yaml; fi
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-albanileria-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
