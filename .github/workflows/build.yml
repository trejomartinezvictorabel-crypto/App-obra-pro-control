name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - run: cp lib/main.dart /tmp/mi_codigo.dart
      - run: flutter create . --org com.albanil.app --project-name app_obra_pro --platforms=android --overwrite
      - run: cp /tmp/mi_codigo.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-albanileria-apk
          path: build/app/outputs/flutter-apk/app-release.apk
