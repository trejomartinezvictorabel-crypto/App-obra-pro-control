name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - run: flutter create . --org com.albanil.app --project-name app_obra_pro --platforms=android
      - run: rm -f lib/main.dart
      - run: mkdir -p lib
      - name: Copy actual main.dart
        run: |
          # Si tienes el main.dart en la raíz, lo mueve a lib/
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-albanileria-apk
          path: build/app/outputs/flutter-apk/app-release.apk
