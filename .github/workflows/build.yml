name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - run: flutter create . --org com.albanil.app --project-name app_obra_pro --platforms=android
      - name: Configurar SDK 35 y Kotlin en Android
        run: |
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 35/g' android/app/build.gradle || true
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/g" android/build.gradle || true
          fi
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-albanileria-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
